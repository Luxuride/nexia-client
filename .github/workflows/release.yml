name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Release Binary
        run: cargo build --release --bin nexia-client --no-default-features
      - name: Package Windows Zip
        shell: bash
        run: |
          mkdir -p release-pkg
          cp target/release/nexia-client.exe release-pkg/
          cp README.md release-pkg/ || true
          cd release-pkg && 7z a ../nexia-client-windows-x86_64.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: nexia-client-windows-x86_64.zip

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and Libadwaita
        run: |
          brew install gtk4 libadwaita pkg-config openssl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Release Binary
        run: cargo build --release --bin nexia-client
      - name: Package macOS Tarball
        run: |
          mkdir -p release-pkg
          cp target/release/nexia-client release-pkg/
          cp README.md release-pkg/ || true
          tar -czvf nexia-client-macos.tar.gz -C release-pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: nexia-client-macos.tar.gz

  build-flatpak:
    name: Build Flatpak Bundle (Linux x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Vendor cargo sources for the offline build
        run: |
          pip install --quiet --root-user-action=ignore \
            flatpak-cargo-generator==0.1.5
          flatpak-cargo-generator Cargo.lock -o flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nexia-client.flatpak
          manifest-path: flatpak/eu.luxuride.nexia.yml
          run-tests: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: nexia-client.flatpak

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/windows-x86_64/nexia-client-windows-x86_64.zip
            artifacts/macos/nexia-client-macos.tar.gz
            artifacts/flatpak-bundle/nexia-client.flatpak
          draft: false
          prerelease: false
