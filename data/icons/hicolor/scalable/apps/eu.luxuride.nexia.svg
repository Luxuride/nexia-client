<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Nexia Client mark: geometric "N" monogram on a rounded gradient tile.
       Abstract lettering only: no cloud silhouette, no Nextcloud blue. -->
  <defs>
    <linearGradient id="nexia-field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#nexia-field)"/>
  <g fill="none" stroke="#ffffff" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 40 90 L 40 38 L 88 90 L 88 38"/>
  </g>
</svg>
