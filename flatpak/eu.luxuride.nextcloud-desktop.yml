app-id: eu.luxuride.nextcloud-desktop
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nextcloud-desktop-rs

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --filesystem=xdg-run/keyring
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.ksecretservice
  - --own-name=eu.luxuride.nextcloud-desktop

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cargo

modules:
  - name: nextcloud-desktop-rs
    buildsystem: simple
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/nextcloud-desktop-rs /app/bin/nextcloud-desktop-rs
      - install -Dm644 data/eu.luxuride.nextcloud-desktop.desktop /app/share/applications/eu.luxuride.nextcloud-desktop.desktop
      - install -Dm644 data/eu.luxuride.nextcloud-desktop.metainfo.xml /app/share/metainfo/eu.luxuride.nextcloud-desktop.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/eu.luxuride.nextcloud-desktop.svg /app/share/icons/hicolor/scalable/apps/eu.luxuride.nextcloud-desktop.svg
    sources:
      - type: dir
        path: ..
