app-id: eu.luxuride.nexia
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nexia-client

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --filesystem=xdg-run/keyring
  - --filesystem=xdg-config/autostart:create
  # /dev/fuse must exist and be openable for the virtual filesystem (VFS) mount.
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.ksecretservice
  # System-account discovery reads GNOME Online Accounts over the session bus.
  - --talk-name=org.gnome.OnlineAccounts
  # The FUSE shim re-executes the host fusermount3 through flatpak-spawn.
  - --talk-name=org.freedesktop.Flatpak
  - --own-name=eu.luxuride.nexia

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/nexia-client/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: nexia-client
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release
      - |
        install -Dm755 target/release/nexia-client \
          ${FLATPAK_DEST}/bin/nexia-client
      # Put the FUSE shim first on PATH so `fuser`'s fusermount auto-detection
      # finds it before it gives up on the sandbox.
      - |
        install -Dm755 flatpak/fusermount3 \
          ${FLATPAK_DEST}/bin/fusermount3
      - |
        install -Dm644 data/${FLATPAK_ID}.desktop \
          ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - |
        install -Dm644 data/${FLATPAK_ID}.metainfo.xml \
          ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - |
        install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg \
          ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .devcontainer
          - target
          - .flatpak-builder
          - flatpak_app
          - repo
      - cargo-sources.json
