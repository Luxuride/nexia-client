[workspace]
resolver = "3"
members = [
    "crates/nextcloud-desktop-core",
    "crates/nextcloud-desktop-sync",
    "crates/nextcloud-desktop-ui",
    "."
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Luxuride/nextcloud-desktop-rs"
authors = ["Luxuride"]

[workspace.dependencies]
# Nextcloud SDK (git-based)
nextcloud-rust-sdk = { git = "https://github.com/Luxuride/nextcloud-rust-sdk" }

# Workspace crates
nextcloud-desktop-core = { path = "crates/nextcloud-desktop-core", version = "0.0.2" }
nextcloud-desktop-sync = { path = "crates/nextcloud-desktop-sync", version = "0.0.2" }
nextcloud-desktop-ui = { path = "crates/nextcloud-desktop-ui", version = "0.0.2", default-features = false }

# External dependencies
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-util", "fs", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
uuid = { version = "1", features = ["v4", "serde"] }
gtk4 = { version = "0.11" }
libadwaita = { version = "0.9", features = ["v1_2"] }
glib = { version = "0.22" }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
uniffi = { version = "0.29" }

[package]
name = "nextcloud-desktop-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Modern GTK desktop application for Nextcloud with virtual file sync"

[features]
default = ["desktop"]
desktop = ["gtk", "tray"]
gtk = ["nextcloud-desktop-ui/gtk"]
tray = ["nextcloud-desktop-ui/tray"]
android = ["nextcloud-desktop-ui/android"]

[dependencies]
nextcloud-desktop-core.workspace = true
nextcloud-desktop-sync.workspace = true
nextcloud-desktop-ui.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true

