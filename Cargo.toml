[workspace]
resolver = "3"
members = [
    "crates/nexia-core",
    "crates/nexia-sync",
    "crates/nexia-ui",
    "."
]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Luxuride/nexia-client"
authors = ["Luxuride"]

[workspace.dependencies]
# Nextcloud SDK (git-based)
nexia-nextcloud-sdk = { git = "https://github.com/Luxuride/nexia-nextcloud-sdk", rev = "700ba42" }

# Workspace crates
nexia-core = { path = "crates/nexia-core", version = "0.0.4" }
nexia-sync = { path = "crates/nexia-sync", version = "0.0.4" }
nexia-ui = { path = "crates/nexia-ui", version = "0.0.4", default-features = false }

# External dependencies
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-util", "fs", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
uuid = { version = "1", features = ["v4", "serde"] }
gtk4 = { version = "0.11" }
libadwaita = { version = "0.9", features = ["v1_2"] }
glib = { version = "0.22" }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
uniffi = { version = "0.29" }

[package]
name = "nexia-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Nexia Client — a GTK 4 desktop file-sync client for Nextcloud servers"

[features]
default = ["desktop"]
desktop = ["gtk", "tray"]
gtk = ["nexia-ui/gtk"]
tray = ["nexia-ui/tray"]
android = ["nexia-ui/android"]

[dependencies]
nexia-core.workspace = true
nexia-sync.workspace = true
nexia-ui.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
