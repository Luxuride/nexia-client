[package]
name = "nexia-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Virtual synchronization engine, full two-way local folder sync, and WebDAV file operations"

[dependencies]
nexia-core.workspace = true
nexia-nextcloud-sdk.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs = "7.0"
notify = "8.0.0"
# The last-resort thumbnail path decodes the original itself, so every format the server may
# refuse to preview has to be decodable here as well.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[dev-dependencies]
# `test-util` provides the paused clock the thumbnail pass scheduler is tested against.
tokio = { version = "1", features = ["test-util"] }
