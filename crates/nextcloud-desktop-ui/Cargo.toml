[package]
name = "nextcloud-desktop-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GTK 4 desktop user interface views and controllers for Nextcloud Desktop"

[features]
default = ["gtk", "tray"]
gtk = ["dep:gtk4", "dep:libadwaita", "dep:glib"]
tray = ["dep:ksni"]

[dependencies]
nextcloud-desktop-core.workspace = true
nextcloud-desktop-sync.workspace = true
nextcloud-rust-sdk.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
gtk4 = { workspace = true, optional = true }
libadwaita = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
ksni = { workspace = true, optional = true }
